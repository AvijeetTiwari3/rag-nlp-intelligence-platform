embedding:
  models:
    - name: "all-MiniLM-L6-v2"
      alias: "MiniLM"
      dim: 384
    - name: "all-mpnet-base-v2"
      alias: "MPNet"
      dim: 768
    - name: "intfloat/e5-small-v2"
      alias: "E5-Small"
      dim: 384
  primary: "all-MiniLM-L6-v2"

retrieval:
  chunk_size: 250               # Target words per document chunk
  chunk_overlap: 40             # Word overlap for chunk continuity
  top_k: 5                      # Top candidates retrieved
  similarity_threshold: 0.50

llm:
  provider: "google"
  model: "gemini-3.5-flash"
  temperature: 0.1
  max_output_tokens: 512

evaluation:
  precision_at_k: [1, 3, 5]
  golden_set_size: 1000
  faithfulness_threshold: 0.70

paths:
  squad_raw: "data/raw/squad_v2_train.parquet"
  squad_val: "data/raw/squad_v2_val.parquet"
  agnews_raw: "data/raw/agnews_train.parquet"
  corpus_chunks: "data/processed/corpus_chunks.parquet"
  eval_golden_set: "data/processed/eval_golden_set.parquet"
  faiss_index: "models/faiss_index"
